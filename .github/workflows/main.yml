name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-11' # Cambiado por defecto para billie
        type: choice
        options:
          - twrp-14.1
          - twrp-12.1
          - twrp-11   # Asegúrate de mantener esta opción activa
          - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/cancian/device_oneplus_billie-twrp'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'twrp-11'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/oneplus/billie'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'billie'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'boot' # El Nord N10 usualmente requiere compilar bootimage en Android 11
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
concurrency:
  
